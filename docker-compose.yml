services:

  # ======================
  # POSTGRES
  # ======================
  postgres:
    image: postgres:15
    container_name: postgres_dw
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: scraping_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ======================
  # PGADMIN
  # ======================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 1234
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # ======================
  # SCRAPING
  # ======================
  scraping:
    build: ./extract
    container_name: scraping_service
    command: python scraper.py
    restart: "no"

    depends_on:
      postgres:
        condition: service_started

    env_file:
      - .env

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./staging:/app/staging
      

  # ======================
  # STAGING
  # ======================
  staging:
    build: ./staging
    container_name: staging_service
    restart: on-failure
    depends_on:
      - scraping
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./staging:/app/staging

  # ======================
  # CLEAN
  # ======================
  clean:
    build: ./clean
    container_name: clean_service
    restart: on-failure
    depends_on:
      - staging
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./staging:/app/staging
  # ======================
  # WAREHOUSE
  # ======================
  warehouse:
    build:
      context: .
      dockerfile: warehouse/Dockerfile
    container_name: warehouse_service
    restart: on-failure
    depends_on:
      - clean
      - postgres
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./staging:/app/staging
# ======================
# VOLUMES
# ======================
volumes:
  postgres_data: